<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bannerBond" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- Subtle pattern for background molecular chain -->
    <pattern id="molPattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Horizontal chain -->
      <circle cx="20" cy="100" r="4" fill="white" opacity="0.03"/>
      <rect x="24" y="98.5" width="22" height="3" rx="1.5" fill="white" opacity="0.03"/>
      <circle cx="50" cy="100" r="5" fill="white" opacity="0.04"/>
      <rect x="55" y="98.5" width="22" height="3" rx="1.5" fill="white" opacity="0.03"/>
      <circle cx="82" cy="100" r="4" fill="white" opacity="0.03"/>
      <rect x="86" y="98.5" width="22" height="3" rx="1.5" fill="white" opacity="0.03"/>
      <circle cx="112" cy="100" r="5" fill="white" opacity="0.04"/>
      <rect x="117" y="98.5" width="22" height="3" rx="1.5" fill="white" opacity="0.03"/>
      <circle cx="144" cy="100" r="4" fill="white" opacity="0.03"/>
      <rect x="148" y="98.5" width="22" height="3" rx="1.5" fill="white" opacity="0.03"/>
      <circle cx="175" cy="100" r="5" fill="white" opacity="0.04"/>
      <!-- Vertical branches -->
      <rect x="48.5" y="78" width="3" height="17" rx="1.5" fill="white" opacity="0.025"/>
      <circle cx="50" cy="74" r="3.5" fill="white" opacity="0.03"/>
      <rect x="110.5" y="105" width="3" height="17" rx="1.5" fill="white" opacity="0.025"/>
      <circle cx="112" cy="126" r="3.5" fill="white" opacity="0.03"/>
      <rect x="173.5" y="78" width="3" height="17" rx="1.5" fill="white" opacity="0.025"/>
      <circle cx="175" cy="74" r="3.5" fill="white" opacity="0.03"/>
      <!-- Second row offset -->
      <circle cx="40" cy="30" r="3" fill="white" opacity="0.02"/>
      <rect x="43" y="28.5" width="18" height="3" rx="1.5" fill="white" opacity="0.02"/>
      <circle cx="65" cy="30" r="4" fill="white" opacity="0.025"/>
      <rect x="69" y="28.5" width="18" height="3" rx="1.5" fill="white" opacity="0.02"/>
      <circle cx="91" cy="30" r="3" fill="white" opacity="0.02"/>
      <!-- Third row -->
      <circle cx="60" cy="170" r="3" fill="white" opacity="0.02"/>
      <rect x="63" y="168.5" width="18" height="3" rx="1.5" fill="white" opacity="0.02"/>
      <circle cx="85" cy="170" r="4" fill="white" opacity="0.025"/>
      <rect x="89" y="168.5" width="18" height="3" rx="1.5" fill="white" opacity="0.02"/>
      <circle cx="111" cy="170" r="3" fill="white" opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bannerBg)"/>

  <!-- Subtle molecular pattern overlay -->
  <rect width="1500" height="500" fill="url(#molPattern)"/>

  <!-- Subtle gradient glow behind logo area -->
  <ellipse cx="250" cy="250" rx="300" ry="200" fill="#06b6d4" opacity="0.04"/>

  <!-- Subtle gradient glow right side -->
  <ellipse cx="1200" cy="250" rx="350" ry="200" fill="#06b6d4" opacity="0.03"/>

  <!-- Left: Logo molecular mark -->
  <g transform="translate(140, 250)">
    <!-- Peptide backbone -->
    <circle cx="-55" cy="0" r="10" fill="rgba(255,255,255,0.12)"/>
    <rect x="-45" y="-3" width="24" height="6" rx="3" fill="url(#bannerBond)" opacity="0.6"/>
    <circle cx="-16" cy="0" r="13" fill="url(#bannerBond)"/>
    <rect x="-3" y="-3" width="24" height="6" rx="3" fill="url(#bannerBond)" opacity="0.6"/>
    <circle cx="26" cy="0" r="10" fill="rgba(255,255,255,0.12)"/>
    <!-- Side chain up -->
    <rect x="-19" y="-40" width="6" height="22" rx="3" fill="url(#bannerBond)" opacity="0.5"/>
    <circle cx="-16" cy="-46" r="8" fill="url(#bannerBond)" opacity="0.8"/>
  </g>

  <!-- Left: Company name -->
  <text x="220" y="225" font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="64" fill="white" letter-spacing="4">TITAN</text>
  <text x="220" y="270" font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="22" fill="#94a3b8" letter-spacing="7">PEPTIDE LAB</text>

  <!-- Thin vertical separator -->
  <line x1="620" y1="160" x2="620" y2="340" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>

  <!-- Right: Tagline -->
  <text x="670" y="215" font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="26" fill="white" letter-spacing="0.5">Research-Grade Peptides</text>

  <!-- Feature pills -->
  <g transform="translate(670, 240)">
    <!-- 99%+ Purity -->
    <rect x="0" y="0" width="160" height="36" rx="18" fill="rgba(6,182,212,0.12)" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
    <text x="80" y="24" font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#06b6d4" text-anchor="middle">99%+ Purity</text>

    <!-- COA Verified -->
    <rect x="176" y="0" width="160" height="36" rx="18" fill="rgba(6,182,212,0.12)" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
    <text x="256" y="24" font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#06b6d4" text-anchor="middle">COA Verified</text>

    <!-- Third-Party Tested -->
    <rect x="352" y="0" width="190" height="36" rx="18" fill="rgba(6,182,212,0.12)" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
    <text x="447" y="24" font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#06b6d4" text-anchor="middle">Third-Party Tested</text>
  </g>

  <!-- Website URL bottom right -->
  <text x="670" y="320" font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-weight="400" font-size="16" fill="#64748b" letter-spacing="1">titanpeptidelab.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="494" width="1500" height="6" fill="url(#bannerBond)"/>
</svg>
