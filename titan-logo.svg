<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100">
  <defs>
    <linearGradient id="bondGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- Molecular/Peptide Bond Mark -->
  <g transform="translate(12, 50)">
    <!-- Peptide backbone: three nodes connected by bonds -->
    <!-- Node 1 (amino group) -->
    <circle cx="8" cy="0" r="5.5" fill="#0f172a"/>
    <!-- Bond 1 -->
    <rect x="13.5" y="-1.8" width="14" height="3.6" rx="1.8" fill="url(#bondGrad)"/>
    <!-- Node 2 (alpha carbon) — larger, central -->
    <circle cx="33" cy="0" r="7" fill="#0f172a"/>
    <!-- Bond 2 -->
    <rect x="40" y="-1.8" width="14" height="3.6" rx="1.8" fill="url(#bondGrad)"/>
    <!-- Node 3 (carbonyl) -->
    <circle cx="59.5" cy="0" r="5.5" fill="#0f172a"/>

    <!-- Side chain branching up from central node -->
    <rect x="31.2" y="-24" width="3.6" height="14" rx="1.8" fill="url(#bondGrad)"/>
    <circle cx="33" cy="-28" r="4.5" fill="#06b6d4"/>

    <!-- Side chain branching down from central node -->
    <rect x="31.2" y="10" width="3.6" height="10" rx="1.8" fill="url(#bondGrad)" opacity="0.5"/>
    <circle cx="33" cy="24" r="3.5" fill="#0f172a" opacity="0.4"/>
  </g>

  <!-- TITAN text -->
  <text x="96" y="52" font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="42" fill="#0f172a" letter-spacing="3">TITAN</text>

  <!-- PEPTIDE LAB text -->
  <text x="96" y="76" font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-weight="500" font-size="16" fill="#64748b" letter-spacing="5.5">PEPTIDE LAB</text>
</svg>
